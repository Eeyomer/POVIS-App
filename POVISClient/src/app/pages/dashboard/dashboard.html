<div class="p-4 sm:p-6 md:p-8">
  <h1 class="font-poppins font-bold text-[19px] sm:text-[22px] text-[#152238] mb-6">Dashboard</h1>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <div class="bg-white rounded-2xl shadow-sm p-5">
      <div class="text-[12px] font-semibold uppercase tracking-wide text-[#7a889c]">Barangays</div>
      <div class="text-[28px] font-bold text-[#152238] mt-1">{{ barangayCount() }}</div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm p-5">
      <div class="text-[12px] font-semibold uppercase tracking-wide text-[#7a889c]">Active Ordinances</div>
      <div class="text-[28px] font-bold text-[#152238] mt-1">{{ ordinanceCount() }}</div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm p-5">
      <div class="text-[12px] font-semibold uppercase tracking-wide text-[#7a889c]">Pending Violations</div>
      <div class="text-[28px] font-bold text-[#152238] mt-1">{{ pendingViolationCount() }}</div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm p-5">
      <div class="text-[12px] font-semibold uppercase tracking-wide text-[#7a889c]">Open Filed Cases</div>
      <div class="text-[28px] font-bold text-[#152238] mt-1">{{ openCaseCount() }}</div>
    </div>
  </div>
</div>
