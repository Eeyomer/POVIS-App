<div class="p-8">
  <h1 class="font-poppins font-bold text-[22px] text-[#241033] mb-6">Dashboard</h1>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <div class="bg-white rounded-2xl shadow-sm p-5">
      <div class="text-[12px] font-semibold uppercase tracking-wide text-[#7a6a89]">Barangays</div>
      <div class="text-[28px] font-bold text-[#241033] mt-1">{{ barangayCount() }}</div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm p-5">
      <div class="text-[12px] font-semibold uppercase tracking-wide text-[#7a6a89]">Active Ordinances</div>
      <div class="text-[28px] font-bold text-[#241033] mt-1">{{ ordinanceCount() }}</div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm p-5">
      <div class="text-[12px] font-semibold uppercase tracking-wide text-[#7a6a89]">Pending Violations</div>
      <div class="text-[28px] font-bold text-[#241033] mt-1">{{ pendingViolationCount() }}</div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm p-5">
      <div class="text-[12px] font-semibold uppercase tracking-wide text-[#7a6a89]">Open Filed Cases</div>
      <div class="text-[28px] font-bold text-[#241033] mt-1">{{ openCaseCount() }}</div>
    </div>
  </div>
</div>
