<div class="fixed top-5 right-5 z-9999 flex flex-col gap-2.5 w-90 max-w-[calc(100vw-2.5rem)] font-inter">
  @for (t of toasts(); track t.id) {
    <div
      class="toast-item flex items-start gap-3 rounded-[10px] border-l-4 shadow-[0_8px_24px_rgba(36,16,51,0.12)] px-4 py-3.5"
      [class]="styleFor(t.severity).bg + ' ' + styleFor(t.severity).border"
      role="alert"
    >
      <div class="shrink-0 mt-0.5" [class]="styleFor(t.severity).iconColor">
        @switch (t.severity) {
          @case ('success') {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
          }
          @case ('warn') {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
          }
          @case ('error') {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>
          }
          @default {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          }
        }
      </div>

      <div class="flex-1 min-w-0">
        @if (t.summary) {
          <div class="font-poppins font-semibold text-[13.5px] text-[#152238]">{{ t.summary }}</div>
        }
        <div class="text-[13px] text-[#4a5972] leading-snug">{{ t.detail }}</div>
      </div>

      @if (t.closable) {
        <button
          type="button"
          class="shrink-0 text-[#8291a6] hover:text-[#152238] transition-colors -mt-0.5 -mr-1"
          aria-label="Dismiss notification"
          (click)="close(t)"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      }
    </div>
  }
</div>
