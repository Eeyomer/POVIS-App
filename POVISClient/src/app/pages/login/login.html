<div class="w-full min-h-screen flex items-center justify-center bg-[#f7f3fb] font-inter px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-sm p-8">
    <div class="text-center mb-6">
      <div class="font-poppins font-bold text-[20px] text-[#241033]">POVIS</div>
      <div class="text-[13px] text-[#7a6a89]">Public Order Violation Information System</div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <div>
        <label class="block text-[13px] font-semibold text-[#241033] mb-1">Username</label>
        <input type="text" formControlName="username" autocomplete="username"
          class="w-full px-3 py-2 rounded-lg border border-[#e2d9ee] text-[14px] focus:outline-none focus:ring-2 focus:ring-[#5b1e8c]" />
      </div>
      <div>
        <label class="block text-[13px] font-semibold text-[#241033] mb-1">Password</label>
        <input type="password" formControlName="password" autocomplete="current-password"
          class="w-full px-3 py-2 rounded-lg border border-[#e2d9ee] text-[14px] focus:outline-none focus:ring-2 focus:ring-[#5b1e8c]" />
      </div>

      @if (errorMessage) {
      <p class="text-[13px] text-red-600">{{ errorMessage }}</p>
      }

      <button type="submit" [disabled]="isSubmitting"
        class="mt-2 w-full py-2.5 rounded-lg bg-[#5b1e8c] text-white text-[14px] font-semibold hover:bg-[#4a1873] transition-colors disabled:opacity-60">
        {{ isSubmitting ? 'Logging in...' : 'Log in' }}
      </button>
    </form>
  </div>
</div>
