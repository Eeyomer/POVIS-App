<main class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="max-w-md text-center">
    <p class="text-7xl font-bold text-red-600">503</p>
    <h1 class="mt-4 text-2xl font-semibold text-gray-900">Service unavailable</h1>
    <p class="mt-2 text-gray-600">
      The system is temporarily unavailable. Please try again later.
    </p>
    <button
      type="button"
      (click)="reload()"
      class="mt-6 rounded-md bg-red-600 px-4 py-2 text-white hover:bg-red-700"
    >
      Try again
    </button>
  </div>
</main>
